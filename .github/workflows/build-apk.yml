name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm install
      - run: npm run build
      - run: npx cap add android
      - run: pip install pillow && python scripts/brand.py
      - run: npx cap sync android
      - name: Build debug APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk Expense.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Expense-apk
          path: Expense.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: 'apk-${{ github.run_number }}'
          name: 'Expense APK ${{ github.run_number }}'
          files: Expense.apk
